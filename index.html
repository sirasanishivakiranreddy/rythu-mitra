<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rythu Mitra: Farmer Information Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF5EA;--surf:#fff;--ink:#16261A;--mut:#44574A;--acc:#2F6B3A;--on:#fff;--sun:#F2B705;--line:#B9CDB9;--bad:#A4262C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A13;--surf:#1A2A1F;--ink:#EAF4EA;--mut:#B2C7B4;--acc:#7CCB8A;--on:#0E1A11;--line:#355039;--bad:#FF9AA0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101A13;--surf:#1A2A1F;--ink:#EAF4EA;--mut:#B2C7B4;--acc:#7CCB8A;--on:#0E1A11;--line:#355039;--bad:#FF9AA0;color-scheme:dark}
:root[data-hc]{--ink:#000;--bg:#fff;--surf:#fff;--mut:#000;--line:#000;--acc:#0A3D14;--on:#fff}
:root[data-hc][data-theme="dark"]{--ink:#fff;--bg:#000;--surf:#000;--mut:#fff;--line:#fff;--acc:#FFE14D;--on:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:calc(112.5% * var(--s,1))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 "Noto Sans","Noto Sans Telugu","Noto Sans Devanagari",system-ui,sans-serif;padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--acc);z-index:30}
h1,h2{margin:0 0 .4em;line-height:1.3}h1{font-size:1.5rem}h2{font-size:1.35rem}
p{margin:0 0 .8em}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
button,a.btn{font:inherit;min-height:48px;min-width:48px;border:3px solid var(--ink);background:var(--surf);color:var(--ink);border-radius:12px;padding:.4rem .9rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:700}
button:active{transform:scale(.97)}
.primary{background:var(--acc);color:var(--on);border-color:var(--acc)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--acc);color:var(--on)}
.hd{max-width:44rem;margin:0 auto;padding:.5rem .9rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
.hd strong{font-size:1.2rem}
.hd button{background:transparent;color:var(--on);border-color:var(--on);min-height:44px;padding:.2rem .7rem}
.hd button[aria-pressed="true"]{background:var(--on);color:var(--acc)}
.tools{display:flex;gap:.35rem;flex-wrap:wrap}
main{max-width:44rem;margin:0 auto;padding:1rem .9rem}
.view{display:none}.view.on{display:block}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.tile{flex-direction:column;min-height:8.5rem;font-size:1.15rem;border-width:3px;border-radius:16px}
.tile .ic{font-size:3rem;line-height:1}
.card{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:.8rem 1rem;margin-bottom:.7rem}
.price{display:flex;align-items:center;gap:.8rem;min-height:4rem}
.price .ic{font-size:2rem}.price .n{flex:1;font-weight:700}.price .v{font-size:1.2rem;font-weight:700;text-align:right}
.price small{display:block;color:var(--mut);font-weight:400}
input[type=search]{width:100%;font:inherit;min-height:52px;padding:.5rem .8rem;border:3px solid var(--ink);border-radius:12px;background:var(--surf);color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(6rem,1fr));gap:.6rem}
.day{text-align:center}.day .ic{font-size:2.4rem}
.note{border-left:6px solid var(--sun);background:var(--surf);padding:.6rem .9rem;border-radius:6px;margin:.8rem 0}
.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:.4rem 0 1rem}.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.opts{display:grid;gap:.7rem}.opts button{min-height:64px;font-size:1.15rem;justify-content:flex-start}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surf);border-top:3px solid var(--acc);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:44rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{flex-direction:column;gap:0;border:0;border-radius:0;min-height:62px;font-size:.78rem;padding:.2rem;background:transparent}
nav button .ic{font-size:1.5rem;line-height:1.2}
nav button[aria-current="page"]{background:var(--acc);color:var(--on)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6.5rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;z-index:40;display:none;max-width:90vw}
details{background:var(--surf);border:2px solid var(--line);border-radius:12px;padding:.5rem .9rem;margin-top:1.2rem;font-size:.9rem}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.big{font-size:1.6rem;font-weight:700}
/* Responsive: small phones */
@media (max-width:360px){
.tiles{grid-template-columns:1fr}
.hd strong{font-size:1.05rem}
nav button{font-size:.68rem}
.price .v{font-size:1.05rem}
}
/* Responsive: tablets */
@media (min-width:640px){
.hd,main,nav div{max-width:56rem}
.tiles{grid-template-columns:repeat(4,1fr)}
.days{grid-template-columns:repeat(5,1fr)}
#pl{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
#pl .card{margin-bottom:0}
.opts{grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
main{padding:1.25rem 1.25rem}
}
/* Responsive: laptops and desktops */
@media (min-width:960px){
.hd,main,nav div{max-width:70rem}
main{padding:1.75rem 2rem}
h1{font-size:2rem}h2{font-size:1.6rem}
.tile{min-height:11rem}
nav button{flex-direction:row;gap:.6rem;font-size:1rem;min-height:60px}
nav button .ic{font-size:1.4rem}
#toast{bottom:5.5rem}
}
/* Responsive: phones in landscape */
@media (max-height:480px) and (orientation:landscape){
nav button{min-height:46px;flex-direction:row;gap:.4rem}
.tile{min-height:6rem}
.tile .ic{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
 <div class="hd">
  <strong id="ttl">Rythu Mitra</strong>
  <div class="tools">
   <button data-lang="en" aria-label="English">EN</button>
   <button data-lang="te" aria-label="Telugu">తె</button>
   <button data-lang="hi" aria-label="Hindi">हि</button>

   <button id="lg" aria-label="Larger text">A+</button>
   <button id="hc" aria-pressed="false" aria-label="High contrast">◐</button>
  </div>
 </div>
</header>
<main id="main" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<nav aria-label="Main"><div id="nav"></div></nav>

else if(d.back){if(ad.w)ad.w=null;else ad.s=null;render(true)}

else if(b.id==="lis"){var s=window.speechSynthesis;if(!s||!window.SpeechSynthesisUtterance){say(t("nov"));return}
s.cancel();var u=new SpeechSynthesisUtterance(main.innerText.replace(/[▲▼🔊]/g,""));u.lang=VC[lang];s.speak(u);say(t("read"))}
else if(b.id==="sm"){sc=Math.max(.85,sc-.1);root.style.setProperty("--s",sc)}
else if(b.id==="lg"){sc=Math.min(1.5,sc+.1);root.style.setProperty("--s",sc)}
else if(b.id==="hc"){var on=!root.hasAttribute("data-hc");on?root.setAttribute("data-hc",""):root.removeAttribute("data-hc");b.setAttribute("aria-pressed",on)}});
document.addEventListener("input",function(e){if(e.target.id==="sq"){q=e.target.value;document.getElementById("pl").innerHTML=list(C.filter(function(c){return t(c[0]).toLowerCase().indexOf(q.toLowerCase())>-1}))}});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(V[h]&&h!==view){view=h;render(true)}});
var sv=load("fp-lang");if(sv&&T[sv])lang=sv;
var h0=location.hash.slice(1);if(V[h0])view=h0;
render(false);
})();
